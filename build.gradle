plugins {
    id 'java'
}

group = 'com.clickjackalope'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.2'
    testCompileOnly 'net.portswigger.burp.extensions:montoya-api:2026.2'
    testRuntimeOnly 'net.portswigger.burp.extensions:montoya-api:2026.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'click-jackalope-burp'

    manifest {
        attributes(
            'Implementation-Title': 'Click-Jackalope',
            'Implementation-Version': project.version
        )
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('copyRootJar') {
    dependsOn jar
    outputs.file(layout.projectDirectory.file('click-jackalope-burp.jar'))
    doLast {
        copy {
            from jar.archiveFile
            into layout.projectDirectory
            rename { 'click-jackalope-burp.jar' }
        }
    }
}

jar.finalizedBy(tasks.named('copyRootJar'))
